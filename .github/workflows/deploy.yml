name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://thebasebev.com' || 'https://the-base-staging.mansua.workers.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_CLOUDFLARE_ACCOUNT_ID: 678720af4dded7d23aad4a859b6e5f3a
      DEPLOY_SCRIPT: ${{ github.ref_name == 'main' && 'deploy:production' || 'deploy:staging' }}
      TARGET_URL: ${{ github.ref_name == 'main' && 'https://thebasebev.com' || 'https://the-base-staging.mansua.workers.dev' }}

    steps:
      - name: Refuse anything but main and develop
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
        run: |
          echo "Deploys run only from main (production) or develop (staging), not ${GITHUB_REF}."
          exit 1

      - name: Enforce the THE BASE Cloudflare account
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as GitHub secrets."
            exit 1
          fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Refusing deploy: CLOUDFLARE_ACCOUNT_ID is not the THE BASE mansua account."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and deploy the Worker
        run: npm run "$DEPLOY_SCRIPT"

      - name: Verify the deployment
        shell: bash
        run: |
          sleep 20
          npm run smoke:http -- "$TARGET_URL"
          npm run audit:crawlers -- "$TARGET_URL"
