name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run check:assets
      - run: npm audit --audit-level=high

      - name: Local route and HTTP audits
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/the-base-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          npm run smoke:http -- http://127.0.0.1:3000
          npm run audit:routes -- http://127.0.0.1:3000 /tmp/route-indexability-audit.md
          npm run audit:analytics -- http://127.0.0.1:3000 /tmp/analytics-audit.md

# Deliberately no deployment job. Staging and production-preview deployment are
# human-controlled until the migration and custom-domain cutover are approved.
